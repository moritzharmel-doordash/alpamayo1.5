[project]
name = "alpamayo1_5"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "accelerate>=1.12.0",
  "einops>=0.8.1",
  "hydra-core>=1.3.2",
  "pillow>=10.0.0",
  "torch>=2.7.0",
  "transformers>=4.57.1",
  "matplotlib>=3.10.7",
  "seaborn>=0.13.2",
]

[build-system]
requires = ["uv_build>=0.9.7,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  "mediapy>=1.2.4",
  "ipykernel>=6.29.3",
  "ipywidgets>=8.1.8",
  "pre-commit>=4.5.1",
  "pytest>=8.0.0",
]

[tool.ruff]
line-length = 100
